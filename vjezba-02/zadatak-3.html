<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      table,
      th,
      td {
        border: 2px solid black;
      }

      tr th {
        text-align: center;
      }

      th,
      td {
        text-align: right;
      }

      table {
        width: 100%;
      }

      th {
        padding: 15px;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Peter</td>
          <td>Griffin</td>
        </tr>
        <tr>
          <td>Lois</td>
          <td>Griffin</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
